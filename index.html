<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Review</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e5e1d8; --note:#f7f5f0;
  --light:#eeeed2; --dark:#769656; --accent:#2563eb;
  --c-brilliant:#0ea5a4; --c-great:#3b82f6; --c-best:#16a34a; --c-excellent:#65a30d;
  --c-good:#84a98c; --c-inaccuracy:#eab308; --c-mistake:#f97316; --c-blunder:#dc2626; --c-forced:#94a3b8; --c-book:#a47551; --c-pending:#9ca3af;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16181d; --panel:#1f232a; --ink:#e6e8eb; --muted:#9aa3ad; --line:#2d333c; --note:#252a32;
  --light:#eeeed2; --dark:#769656; --accent:#60a5fa;
}}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:20px;margin:0 0 4px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
.col{min-width:0}
.boardrow{display:flex;gap:8px}
.evalbar{width:30px;border-radius:6px;overflow:hidden;background:#333;position:relative;flex:none}
.evalbar .w{position:absolute;bottom:0;left:0;right:0;background:#f5f5f5;transition:height .25s}
.evalbar.flip .w{bottom:auto;top:0}
.evalbar span{position:absolute;left:0;right:0;padding:0 1px;text-align:center;font-size:10px;line-height:12px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.board{position:relative;flex:1;min-width:0;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq .hl{position:absolute;inset:0;opacity:.45}
.cg-wrap piece{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;z-index:1}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.7}
.coord.f{right:3px;bottom:1px} .coord.r{left:3px;top:1px}
.badge{position:absolute;top:-2px;right:-2px;width:22px;height:22px;padding:3px;border-radius:50%;display:flex;box-shadow:0 1px 3px #0006;z-index:3}
.gl{width:100%;height:100%;display:block}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.players{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-weight:600;min-width:0}
.players span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players .acc{flex:none;font-size:13px;padding:2px 8px;border-radius:6px;background:var(--line)}
.nav{display:flex;gap:6px;margin-top:10px}
.nav button,.btn{flex:1;min-height:48px;padding:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer;touch-action:manipulation}
.nav button:hover,.btn:hover{border-color:var(--accent)}
.nav button:active{background:var(--line)}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.status .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.status .bar div{height:100%;background:var(--accent);width:0;transition:width .2s}
.coach{display:flex;gap:10px;align-items:flex-start;min-height:120px}
.coach .icon{flex:none;width:34px;height:34px;padding:5px;border-radius:50%;display:flex}
.coach b{font-size:16px}
.coach .expl{margin:4px 0 6px}
.moves{position:relative;max-height:440px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:10px;border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:4px}
.mv{min-height:44px;padding:4px 6px;border:0;background:none;text-align:left;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;touch-action:manipulation}
.mv:hover{background:var(--line)} .mv.cur{outline:2px solid var(--accent);outline-offset:-2px;background:var(--note)}
.dot{width:18px;height:18px;padding:2px;border-radius:50%;display:inline-flex;flex:none;vertical-align:-4px}
.num{color:var(--muted);display:flex;align-items:center}
.note{margin:0 0 6px 38px;padding:6px 9px;border-left:3px solid var(--c-pending);background:var(--note);border-radius:0 6px 6px 0;font-size:13px;line-height:1.4;cursor:pointer}
.note[hidden]{display:none}
.note b{white-space:nowrap}
.note .dot{margin-right:4px}
.note.cur{outline:2px solid var(--accent);outline-offset:-2px}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td{padding:4px 6px;border-top:1px solid var(--line)}
table.sum td:nth-child(1),table.sum td:nth-child(3){text-align:center;font-weight:700;width:60px}
table.sum tr.accrow td{font-size:20px;border-top:none}
table.sum tr.names td{border-top:none;padding-bottom:0}
.sumnames{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700}
.sumnames span{min-width:0;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.graph{width:100%;height:90px;display:block;cursor:pointer;border-radius:6px;margin-top:10px;background:#3a3a3a}
.stack>*+*{margin-top:12px}
.keys{padding-left:0;list-style:none;margin:6px 0 0}
.keys li{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.gamelist a{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:48px;padding:10px 12px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.gamelist a:hover{background:var(--line)}
.w-win{color:var(--c-best);font-weight:700} .w-loss{color:var(--c-blunder);font-weight:700} .w-draw{color:var(--muted);font-weight:700}
select,input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:16px;min-height:44px}
@media (max-width:860px){
  .grid{display:flex;flex-direction:column;align-items:stretch;gap:0}
  .col{display:contents}
  .stack>*+*{margin-top:0}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6;margin-top:10px}
  .o7{order:7}.o8{order:8;margin-top:12px}.o9{order:9;margin-top:12px}.o10{order:10;margin-top:12px}.o11{order:11;margin-top:12px}
  .coach{min-height:140px}
  .moves{max-height:min(60vh,560px)}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">Loading…</div></div>

<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';

const SF_BASE = 'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/';
const HAS_WASM = typeof WebAssembly === 'object';
// WASM build is ~5x faster; its loader wants stockfish.wasm "next to" the script, so point that fetch at the CDN.
const WORKER_SRC = HAS_WASM
  ? `const f=self.fetch.bind(self);self.fetch=(u,o)=>f(String(u).endsWith('stockfish.wasm')?'${SF_BASE}stockfish.wasm':u,o);importScripts('${SF_BASE}stockfish.wasm.js');`
  : `importScripts('${SF_BASE}stockfish.js');`;
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const USER = (qs.get('user') || '').toLowerCase();
const GAME_ID = qs.get('id');
const MONTH = qs.get('month');
// Phones and small screens default to a lighter depth so the review fills in quickly.
const SMALL = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || Math.min(window.innerWidth, screen.width || 9999) < 700;
const EXPLICIT_DEPTH = qs.has('depth');
let DEPTH = +(qs.get('depth') || (SMALL ? 12 : 14));
const PV_LEN = 10;
// Moves first flagged as inaccuracy/mistake/blunder are re-checked at this depth before their verdict is shown.
const DEEP = 18;

// Classification icons are inline SVG (white on the colored dot) so they look the same on every device,
// with no dependence on emoji or symbol fonts. All drawn on a 20x20 grid.
const EXCL = x => `<path d="M${x} 4.6v6.8"/><circle cx="${x}" cy="15.3" r="1.35" fill="#fff" stroke="none"/>`;
const QUES = (x, s = 1) => `<g transform="translate(${x} 0) scale(${s} 1)"><path d="M-2.6 7.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1 .8-1 1.5v.9"/></g><circle cx="${x}" cy="15.3" r="1.35" fill="#fff" stroke="none"/>`;
const GLYPH = {
  brilliant: EXCL(7) + EXCL(13),
  great: EXCL(10),
  best: '<path fill="#fff" stroke="none" d="M10 2.8l2.1 4.6 5 .5-3.8 3.4 1.1 4.9L10 13.7l-4.4 2.5 1.1-4.9-3.8-3.4 5-.5z"/>',
  check: '<path stroke-width="2.6" d="M5 10.4l3.4 3.4L15.2 6.6"/>',
  book: '<path fill="#fff" stroke="none" d="M9.3 6.1C7.7 5 5.8 4.6 3.8 4.8v9.9c1.9-.2 3.9.2 5.5 1.3zM10.7 6.1c1.6-1.1 3.5-1.5 5.5-1.3v9.9c-1.9-.2-3.9.2-5.5 1.3z"/>',
  forced: '<path stroke-width="2" d="M7 9.2V7.4a3 3 0 0 1 6 0v1.8"/><rect x="5" y="9.2" width="10" height="7.4" rx="1.6" fill="#fff" stroke="none"/>',
  inaccuracy: QUES(7.6, .9) + EXCL(14),
  mistake: QUES(10),
  blunder: QUES(6.3, .82) + QUES(13.7, .82),
  pending: '<circle cx="5.5" cy="10" r="1.4" fill="#fff" stroke="none"/><circle cx="10" cy="10" r="1.4" fill="#fff" stroke="none"/><circle cx="14.5" cy="10" r="1.4" fill="#fff" stroke="none"/>',
  start: '<path fill="#fff" stroke="none" d="M10 3.4a2.6 2.6 0 0 0-1.6 4.7C7.3 8.7 6.8 9.6 6.9 10.6h1.6c-.1 1.6-.6 3-1.9 4.1v1.9h6.8v-1.9c-1.3-1.1-1.8-2.5-1.9-4.1h1.6c.1-1-.4-1.9-1.5-2.5A2.6 2.6 0 0 0 10 3.4z"/>',
};
const svgIcon = k => `<svg class="gl" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${GLYPH[k]}</svg>`;
const CLS = {
  brilliant: {sym:'!!', icon:'brilliant', label:'Brilliant', color:'var(--c-brilliant)', say:'brilliant'},
  great:     {sym:'!',  icon:'great', label:'Great move', color:'var(--c-great)', say:'a great move'},
  best:      {sym:'',   icon:'best', label:'Best move', color:'var(--c-best)', say:'the best move'},
  excellent: {sym:'',   icon:'check', label:'Excellent', color:'var(--c-excellent)', say:'an excellent move'},
  good:      {sym:'',   icon:'check', label:'Good', color:'var(--c-good)', say:'a good move'},
  book:      {sym:'',   icon:'book', label:'Book', color:'var(--c-book)', say:'a book move'},
  forced:    {sym:'',   icon:'forced', label:'Forced', color:'var(--c-forced)', say:'forced'},
  inaccuracy:{sym:'?!', icon:'inaccuracy', label:'Inaccuracy', color:'var(--c-inaccuracy)', say:'an inaccuracy'},
  mistake:   {sym:'?',  icon:'mistake', label:'Mistake', color:'var(--c-mistake)', say:'a mistake'},
  blunder:   {sym:'??', icon:'blunder', label:'Blunder', color:'var(--c-blunder)', say:'a blunder'},
};
// a colored dot with the class icon; `cls` may also be 'pending'
const dotHtml = (cls, extra = 'dot') => `<span class="${extra}" style="background:${CLS[cls]?.color || 'var(--c-pending)'}">${svgIcon(CLS[cls]?.icon || 'pending')}</span>`;
const ORDER = ['brilliant','great','best','excellent','good','book','forced','inaccuracy','mistake','blunder'];
const NOTABLE = ['brilliant','great','inaccuracy','mistake','blunder'];
const BAD = ['inaccuracy','mistake','blunder'];
const VAL = {p:1,n:3,b:3,r:5,q:9,k:100};
const PIECE = {k:'king',q:'queen',r:'rook',b:'bishop',n:'knight',p:'pawn'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getJSON = async url => { const r = await fetch(url); if (!r.ok) throw new Error(`chess.com API ${r.status} for ${url}`); return r.json(); };

/* ---------- engine ---------- */
class Engine {
  constructor(){
    const blob = new Blob([WORKER_SRC], {type:'application/javascript'});
    this.w = new Worker(URL.createObjectURL(blob));
    this.subs = [];
    this.w.onmessage = e => { const line = String(e.data); this.subs.slice().forEach(f => f(line)); };
  }
  send(c){ this.w.postMessage(c); }
  waitFor(pred){ return new Promise(res => { const f = l => { if (pred(l)) { this.subs = this.subs.filter(x => x !== f); res(l); } }; this.subs.push(f); }); }
  async init(){
    const boot = (async () => {
      this.send('uci'); await this.waitFor(l => l === 'uciok');
      this.send('setoption name MultiPV value 2');
      this.send('isready'); await this.waitFor(l => l === 'readyok');
    })();
    const fail = new Promise((_, rej) => {
      this.w.onerror = e => rej(new Error(e.message || 'the engine worker could not load'));
      setTimeout(() => rej(new Error('the engine did not start within 30 seconds')), 30000);
    });
    await Promise.race([boot, fail]);
  }
  async analyse(fen, depth){
    const lines = {};
    const f = l => {
      if (!l.startsWith('info') || !l.includes(' pv ')) return;
      const k = +(l.match(/ multipv (\d+)/)?.[1] || 1);
      const s = l.match(/ score (cp|mate) (-?\d+)/);
      if (s) lines[k] = {type:s[1], value:+s[2], pv:l.split(' pv ')[1].trim().split(' ')};
    };
    this.subs.push(f);
    this.send('position fen ' + fen);
    this.send('go depth ' + depth);
    await this.waitFor(l => l.startsWith('bestmove'));
    this.subs = this.subs.filter(x => x !== f);
    return [lines[1], lines[2]].filter(Boolean);
  }
}

/* ---------- eval helpers (all white point-of-view) ---------- */
const winFromCp = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
function toWhite(line, stm){
  const sgn = stm === 'w' ? 1 : -1;
  if (line.type === 'mate') { const m = line.value * sgn; return {mate:m, win: m > 0 ? 100 : 0, text:(m > 0 ? 'M' : '-M') + Math.abs(m)}; }
  const cp = line.value * sgn;
  return {cp, win: winFromCp(cp), text:(cp >= 0 ? '+' : '') + (cp/100).toFixed(1)};
}
const moveAcc = loss => Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * loss) - 3.1669));

/* ---------- data ---------- */
async function findGame(){
  let months = MONTH ? [MONTH] : [];
  if (!months.length) {
    const {archives} = await getJSON(`https://api.chess.com/pub/player/${USER}/games/archives`);
    months = archives.slice(-3).reverse().map(u => u.split('/games/')[1]);
  }
  for (const m of months) {
    const {games} = await getJSON(`https://api.chess.com/pub/player/${USER}/games/${m}`);
    const g = games.find(g => g.url.endsWith('/' + GAME_ID));
    if (g) return g;
  }
  throw new Error('Game not found in that player\'s recent archives.');
}

function buildPositions(pgn){
  const src = new Chess(); src.loadPgn(pgn);
  const hdr = src.header();
  const start = hdr.SetUp === '1' && hdr.FEN ? hdr.FEN : undefined;
  const moves = src.history({verbose:true});
  const c = start ? new Chess(start) : new Chess();
  const fens = [c.fen()], meta = [{checkmate:c.isCheckmate(), draw:c.isDraw(), legal:c.moves().length, check:c.inCheck()}];
  for (const m of moves) { c.move(m.san); fens.push(c.fen()); meta.push({checkmate:c.isCheckmate(), draw:c.isDraw()||c.isStalemate(), legal:c.moves().length, check:c.inCheck()}); }
  return {moves, fens, meta};
}

/* ---------- chess helpers ---------- */
const other = c => c === 'w' ? 'b' : 'w';
const colorName = c => c === 'w' ? 'White' : 'Black';
const uciObj = u => ({from:u.slice(0,2), to:u.slice(2,4), promotion:u[4]});
function tryMove(c, u){ try { return c.move(uciObj(u)); } catch { return null; } }
function uciToSan(fen, uci){ const m = tryMove(new Chess(fen), uci); return m ? m.san : uci; }
function pvSan(fen, pv, n = 5){
  const c = new Chess(fen), out = [];
  for (const u of pv.slice(0, n)) { const m = tryMove(c, u); if (!m) break; out.push(m.san); }
  return out.join(' ');
}
// material balance from `color`'s point of view (kings ignored)
function matDiff(c, color){
  let d = 0;
  for (const row of c.board()) for (const p of row) if (p && p.type !== 'k') d += (p.color === color ? 1 : -1) * VAL[p.type];
  return d;
}
// play a line and return the white-POV material at its end; if the line stops right after a capture
// that can simply be taken back, count the recapture so a truncated line doesn't overstate a gain
function settle(fen, ucis, max = 8){
  const c = new Chess(fen), took = {w:[], b:[]};
  let last = null, n = 0, upto = 0;
  for (const u of ucis.slice(0, max)) { const m = tryMove(c, u); if (!m) break; last = m; n++; if (m.captured) { took[m.color].push(m.captured); upto = n; } }
  let d = matDiff(c, 'w');
  if (last && last.captured && !c.isGameOver() && c.moves({verbose:true}).some(x => x.to === last.to)) {
    const v = last.promotion || last.piece;
    d += (last.color === 'w' ? -1 : 1) * VAL[v];
    took[c.turn()].push(v);
  }
  return {d, took, upto: Math.max(2, upto)};
}
// pieces of `color` that can be taken for free or by something cheaper
function loosePieces(c, color){
  const en = other(color), out = [];
  for (const row of c.board()) for (const p of row) {
    if (!p || p.color !== color || p.type === 'k') continue;
    const att = c.attackers(p.square, en);
    if (!att.length) continue;
    const def = c.attackers(p.square, color);
    const minAtt = Math.min(...att.map(s => VAL[c.get(s).type]));
    if (!def.length || minAtt < VAL[p.type]) out.push({sq:p.square, type:p.type});
  }
  return out.sort((a, b) => VAL[b.type] - VAL[a.type]);
}
// enemy pieces the piece on `sq` attacks that are worth attacking (the king, something more valuable, or undefended)
function threats(c, sq){
  const me = c.get(sq); if (!me) return [];
  const en = other(me.color), out = [];
  for (const row of c.board()) for (const p of row) {
    if (!p || p.color !== en || p.type === 'p') continue;
    if (!c.attackers(p.square, me.color).includes(sq)) continue;
    if (p.type === 'k' || VAL[p.type] > VAL[me.type] || !c.attackers(p.square, en).length) out.push(p);
  }
  return out.sort((a, b) => VAL[b.type] - VAL[a.type]);
}
function joinP(ph){
  if (ph.length <= 1) return ph.join('');
  return ph.slice(0, -1).join(', ') + ' and ' + ph[ph.length - 1];
}
function standing(w){ return w >= 90 ? 'winning' : w >= 70 ? 'clearly better' : w >= 58 ? 'slightly better' : w > 42 ? 'about equal' : w > 30 ? 'slightly worse' : w > 10 ? 'clearly worse' : 'losing'; }
function keepPhrase(C, w){
  if (w > 42 && w < 58) return 'keeps the game roughly level by the engine\'s estimate';
  if (w >= 58) return `keeps ${C} ${standing(w)} by the engine's estimate`;
  return `holds out best by the engine's estimate, though it still rates ${C} as ${standing(w)}`;
}
// "about a pawn", "about 2.3 pawns"
function pawnsPhrase(cp){
  const p = Math.abs(cp) / 100;
  if (p < 0.15) return 'next to nothing';
  if (p < 0.75) return 'about half a pawn';
  if (p < 1.25) return 'about a pawn';
  return `about ${p.toFixed(1)} pawns`;
}
// engine verdict on a position, from the mover's point of view, worded as an estimate
function evalPhrase(line, C, O, me){
  if (!line) return '';
  if (line.mate != null) { const m = me === 'w' ? line.mate : -line.mate; return `the engine finds a forced mate in ${Math.abs(m)} for ${m > 0 ? C : O}`; }
  const cp = me === 'w' ? line.cp : -line.cp;
  if (Math.abs(cp) < 15) return 'the engine rates it as roughly level';
  return `the engine gives ${cp > 0 ? C : O} ${pawnsPhrase(cp)}`;
}
function gainPhrase(net, took){
  const has = t => took.includes(t);
  if (net >= 8 && has('q')) return 'wins the queen';
  if (net >= 4 && has('q')) return 'comes out well ahead, picking up the queen';
  if (net >= 5 && has('r')) return 'wins a rook';
  if (net >= 5) return 'wins a lot of material';
  if (net >= 3) { const t = ['b','n'].find(has); return t ? `wins a ${PIECE[t]}` : 'wins a piece'; }
  if (net >= 2) return has('r') ? 'wins the exchange' : took.every(t => t === 'p') ? 'wins two pawns' : 'wins material';
  if (net >= 1) return 'wins a pawn';
  return '';
}
// what a move does, as short verb phrases ("takes the knight on e5", "forks the king and the rook")
function describeMove(mv, prev, ply){
  if (!mv) return [];
  const c = new Chess(mv.after), before = new Chess(mv.before), me = mv.color;
  if (c.isCheckmate()) return ['delivers checkmate'];
  const ph = [];
  if (mv.flags.includes('k') || mv.flags.includes('q')) ph.push(`castles ${mv.flags.includes('k') ? 'kingside' : 'queenside'}, tucking the king away`);
  if (mv.promotion) ph.push(`promotes to a ${PIECE[mv.promotion]}`);
  if (mv.captured) {
    if (prev && prev.captured && prev.to === mv.to) ph.push(`recaptures the ${PIECE[mv.captured]}`);
    else if (mv.flags.includes('e')) ph.push('captures en passant');
    else ph.push(`takes the ${PIECE[mv.captured]} on ${mv.to}`);
  }
  const t = threats(c, mv.to);
  if (t.length >= 2) ph.push(`forks the ${t[0].type === 'k' ? 'king' : `${PIECE[t[0].type]} on ${t[0].square}`} and the ${PIECE[t[1].type]} on ${t[1].square}`);
  else if (t.length === 1 && t[0].type !== 'k') ph.push(`attacks the ${PIECE[t[0].type]} on ${t[0].square}`);
  if (c.inCheck() && !(t.length >= 2 && t[0].type === 'k')) ph.push('gives check');
  if (ph.length < 2 && !mv.captured) {
    const wasLoose = loosePieces(before, me), nowLoose = loosePieces(c, me).map(p => p.sq);
    if (wasLoose.some(p => p.sq === mv.from) && !nowLoose.includes(mv.to)) ph.push(`moves the ${PIECE[mv.piece]} out of danger`);
    else {
      const saved = wasLoose.find(p => p.sq !== mv.from && !nowLoose.includes(p.sq) && c.get(p.sq)?.type === p.type);
      if (saved) ph.push(`protects the ${PIECE[saved.type]} on ${saved.sq}`);
    }
  }
  if (ph.length < 2 && ply < 30 && 'nb'.includes(mv.piece) && mv.from[1] === (me === 'w' ? '1' : '8')) ph.push(`develops the ${PIECE[mv.piece]}`);
  if (ph.length < 2 && ply < 20 && mv.piece === 'p' && ['d4','e4','d5','e5'].includes(mv.to)) ph.push('stakes a claim in the center');
  if (ph.length < 2 && mv.piece === 'p' && !mv.promotion && mv.to[1] === (me === 'w' ? '7' : '2')) ph.push('pushes the pawn to the brink of promotion');
  return ph.slice(0, 2);
}

/* ---------- classification ---------- */
// B / Af: engine results for the positions before and after move i (same depth for both)
function classifyMove(i, moves, fens, meta, B, Af){
  const m = moves[i];
  const pov = x => m.color === 'w' ? x : 100 - x;
  const before = pov(B.win), after = pov(Af.win);
  const loss = Math.max(0, before - after);
  const played = m.from + m.to + (m.promotion || '');
  const [l1, l2] = B.lines;
  const isBest = !!l1 && played === l1.uci;
  let cls;
  if (meta[i].legal === 1) cls = 'forced';
  else if ((i < 8 && loss < 20) || (i < 16 && loss < 8 && Math.abs(Af.win - 50) < 15)) cls = 'book';
  else if (loss < 2 && isSacrifice(m, fens[i+1]) && after >= 50 && before < 90) cls = 'brilliant';
  else if (isBest && l2 && pov(l1.win) - pov(l2.win) >= 15 && before < 95 && !(m.captured && moves[i-1]?.to === m.to)) cls = 'great';
  else if (isBest || loss < 1) cls = 'best';
  else if (loss < 3) cls = 'excellent';
  else if (loss < 6) cls = 'good';
  else if (loss < 12) cls = 'inaccuracy';
  else if (loss < 22) cls = 'mistake';
  else cls = 'blunder';
  return {cls, loss, acc: moveAcc(loss), best: l1 ? uciToSan(fens[i], l1.uci) : null, bestUci: l1?.uci, isBest};
}
// heuristic: a non-pawn piece lands where a cheaper enemy piece can take it, and it wasn't simply a trade
function isSacrifice(m, fenAfter){
  if (m.piece === 'p' || m.piece === 'k' || m.promotion) return false;
  const gained = m.captured ? VAL[m.captured] : 0;
  if (gained >= VAL[m.piece]) return false;
  const c = new Chess(fenAfter);
  return c.moves({verbose:true}).some(r => r.to === m.to && VAL[r.piece] < VAL[m.piece]);
}

function accuracy(rs, color, moves){
  const a = rs.filter((r, i) => r && moves[i].color === color).map(r => r.acc);
  if (!a.length) return 0;
  const mean = a.reduce((x, y) => x + y, 0) / a.length;
  const harm = a.length / a.reduce((x, y) => x + 1 / Math.max(y, 5), 0);
  return (mean + harm) / 2;
}

/* ---------- move explanations ---------- */
// Builds 1-3 plain-language sentences for move i from the engine lines and simple board facts.
// Every move or line named here is replayed through chess.js first (tryMove / pvSan / settle stop at the
// first illegal move), and judgments that rest only on the evaluation are worded as engine estimates.
function explainMove(i, ctx, B, Af){
  const {moves, fens, meta, R, opening} = ctx;
  const m = moves[i], r = R[i], me = m.color, en = other(me);
  const C = colorName(me), O = colorName(en);
  const pov = w => me === 'w' ? w : 100 - w;
  const mateFor = l => l && l.mate != null ? (me === 'w' ? l.mate : -l.mate) : null; // >0: mover mates
  const l1 = B.lines[0], l2 = B.lines[1], reply = Af.lines[0];
  const prev = moves[i-1] || null;
  const did = describeMove(m, prev, i);
  const doesS = did.length ? `${m.san} ${joinP(did)}.` : '';
  const winB = pov(B.win), winA = pov(Af.win);
  const played = m.from + m.to + (m.promotion || '');
  const bestMv = l1 ? tryMove(new Chess(fens[i]), l1.uci) : null;
  const bestSan = bestMv?.san || r.best;
  const replyMv = reply ? tryMove(new Chess(fens[i+1]), reply.uci) : null;
  const m0 = matDiff(new Chess(fens[i]), me);
  const mpov = d => me === 'w' ? d : -d;
  const ref = settle(fens[i], [played, ...(reply?.pv || [])], 9);
  const refLoss = m0 - mpov(ref.d);                 // material the mover ends up losing after the played move
  const bst = l1 ? settle(fens[i], l1.pv, 8) : null;
  const bestLine = () => pvSan(fens[i], l1.pv, Math.min(8, bst.upto));
  const bestGain = bst ? mpov(bst.d) - m0 : 0;      // material the best line wins (negative = it also loses some)
  const mA = mateFor(reply), mB = mateFor(l1);
  const S = [];
  let note = '';

  if (meta[i+1].checkmate) {
    S.push(`${m.san} is checkmate. Game over.`);
    return {text:S.join(' '), note:S[0]};
  }

  switch (r.cls) {
    case 'book':
      S.push(doesS || `${m.san} is a well-known opening move.`);
      S.push(`This is standard opening play${opening ? ` in the ${opening}` : ''}.`);
      break;
    case 'forced':
      S.push(`${m.san} was the only legal move${meta[i].check ? ' to get out of check' : ''}.`);
      break;
    case 'best': case 'great': case 'brilliant': case 'excellent': case 'good': {
      if (r.cls === 'brilliant') {
        const c = new Chess(fens[i+1]);
        const att = c.attackers(m.to, en).map(s => c.get(s).type).sort((a, b) => VAL[a] - VAL[b])[0];
        S.push(`${m.san} puts the ${PIECE[m.piece]} where ${att ? `the ${PIECE[att]}` : `${O}`} can take it, a real sacrifice.`);
        S.push(`The engine doesn't think taking it pays off for ${O}: it still rates ${C} as ${standing(winA)} (${Af.text}).`);
        break;
      }
      S.push(doesS || (r.cls === 'best' || r.cls === 'great' ? `${m.san} is the engine's top choice here.` : `${m.san} is a sensible move.`));
      if (r.cls === 'great') {
        if (l2) {
          const m2 = mateFor(l2), w2 = pov(l2.win);
          const conseq = m2 != null && m2 < 0 ? `runs into a forced mate in ${-m2} according to the engine`
            : (w2 <= 42 && winA > 42) || (w2 < 58 && winA >= 58) ? `would leave ${C} ${standing(w2)} by the engine's estimate`
            : `rates only ${l2.text} by the engine's estimate`;
          S.push(`The engine sees it as the only move that ${winA >= 70 ? 'keeps the advantage' : 'holds the position'}: the next best option, ${uciToSan(fens[i], l2.uci)}, ${conseq}.`);
        } else S.push('The engine sees it as clearly the strongest option here.');
      } else if (r.cls === 'best') {
        if (mA != null && mA > 0) S.push(`The engine reports a forced mate in ${mA} after it.`);
        else if (r.isBest && bestGain >= 1 && !m.captured) S.push(`In the engine's main line it ${gainPhrase(bestGain, bst.took[me])} (${bestLine()}).`);
        else if (!r.isBest && bestSan) S.push(`It's just as good as the engine's first choice, ${bestSan}, and ${keepPhrase(C, winA)}.`);
        else S.push(`It's the engine's top choice and ${keepPhrase(C, winA)}.`);
      } else if (r.cls === 'excellent') {
        S.push(`The engine rates it nearly as strong as its top pick, ${bestSan}.`);
      } else {
        const extra = bestGain >= 1 && mpov(bst.d) - mpov(ref.d) >= 1 ? `, which ${gainPhrase(bestGain, bst.took[me])}` : '';
        S.push(`The engine slightly prefers ${bestSan}${extra}.`);
      }
      break;
    }
    default: { // inaccuracy / mistake / blunder
      let generic = false;
      if (mA != null && mA < 0 && !(mB != null && mB < 0)) {
        S.push(`${m.san} allows a forced mate in ${-mA} by the engine's count${replyMv ? `, starting with ${replyMv.san}` : ''}.`);
      } else if (mB != null && mB > 0 && !(mA != null && mA > 0)) {
        S.push(`${m.san} lets a mate slip away: the engine had found a forced mate in ${mB} here.`);
      } else if (refLoss >= 1 && (!bst || refLoss > m0 - mpov(bst.d))) {
        const loose = loosePieces(new Chess(fens[i+1]), me);
        const hung = replyMv?.captured && loose.find(p => p.sq === replyMv.to && VAL[p.type] >= refLoss - 0.5);
        const gain = gainPhrase(refLoss, ref.took[en]);
        if (hung) S.push(`${m.san} leaves the ${PIECE[hung.type]} on ${hung.sq} unprotected, and ${O} can grab it with ${replyMv.san}.`);
        else {
          const tac = describeMove(replyMv, m, i + 1).find(p => /^forks|^attacks|^gives check/.test(p));
          S.push(`${m.san} allows ${replyMv ? replyMv.san : 'a strong reply'}${tac ? `, which ${tac},` : ''} and in the engine's line ${O} ${gain}${replyMv && reply ? ` (${pvSan(fens[i+1], reply.pv, Math.max(1, ref.upto - 1))})` : ''}.`);
        }
      } else if (bst && bestGain >= 1 && mpov(bst.d) - mpov(ref.d) >= 1) {
        S.push(`${m.san} misses a chance to win material that the engine found.`);
      } else {
        generic = true;
        const rd = describeMove(replyMv, m, i + 1).filter(p => !/^develops|^stakes/.test(p));
        const cpB = l1?.cp, cpA = reply?.cp;
        if (rd.length && replyMv) S.push(`After ${m.san}, ${O} gets ${replyMv.san}, which ${joinP(rd)}.`);
        else if (cpB != null && cpA != null) S.push(`By the engine's estimate, ${m.san} gives away ${pawnsPhrase(mpov(cpB) - mpov(cpA))} without a concrete gain.`);
        else S.push(`The engine thinks ${m.san} lets ${O} improve the position.`);
      }
      // the better move and its idea
      const ideas = [];
      let showLine = false;
      if (mB != null && mB > 0) { ideas.push(`leads to a forced mate in ${mB} according to the engine`); showLine = true; }
      else {
        const bd = describeMove(bestMv, prev, i);
        const gainS = bst && bestGain >= 1 && mpov(bst.d) - mpov(ref.d) >= 1 ? gainPhrase(bestGain, bst.took[me]) : '';
        ideas.push(...(gainS ? bd.filter(p => !/^takes|^recaptures/.test(p)) : bd).slice(0, 2));
        if (mA != null && mA < 0) ideas.push('keeps the king out of the mating net');
        if (gainS) { ideas.push(`in the engine's line ${gainS}`); showLine = true; }
        else if (refLoss >= 1 && bst && m0 - mpov(bst.d) < refLoss) ideas.push('keeps the material level');
      }
      const tail = ideas.length ? `, which ${joinP(ideas.slice(0, 3))}` : `: ${evalPhrase(l1, C, O, me) || 'it holds up better'}`;
      const bestS = bestSan ? `The engine prefers ${bestSan}${tail}` : '';
      if (bestS) S.push(bestS + (showLine && l1 ? ` (${mB != null && mB > 0 ? pvSan(fens[i], l1.pv, 2 * mB - 1) : bestLine()}).` : '.'));
      const sa = standing(winB), sb = standing(winA);
      if ((r.cls !== 'inaccuracy' || generic) && sa !== sb && S.length < 3) S.push(`By the engine's estimate, ${C} goes from ${sa} to ${sb}.`);
      note = S[0] + (bestS ? ' ' + bestS + '.' : '');
    }
  }
  return {text:S.join(' '), note: note || S.slice(0, 2).join(' ')};
}

/* ---------- views ---------- */
async function gameList(){
  const {archives} = await getJSON(`https://api.chess.com/pub/player/${USER}/games/archives`);
  const months = archives.slice(-2).reverse();
  let games = [];
  for (const u of months) { const {games:g} = await getJSON(u); games.push(...g.map(x => ({...x, _m:u.split('/games/')[1]}))); }
  games = games.filter(g => g.rules === 'chess').sort((a, b) => b.end_time - a.end_time).slice(0, 40);
  app.innerHTML = `<h1>Recent games — ${esc(USER)}</h1><div class="sub">Pick a game to review</div>
  <div class="card gamelist" style="margin-top:12px;padding:0">${games.map(g => {
    const me = g.white.username.toLowerCase() === USER ? g.white : g.black, op = me === g.white ? g.black : g.white;
    const r = resultFor(me, op);
    const id = g.url.split('/').pop();
    return `<a href="?user=${encodeURIComponent(USER)}&id=${id}&month=${g._m}"><span>vs <b>${esc(op.username)}</b> (${op.rating}) · ${esc(g.time_class)}</span><span class="w-${r.kind}">${r.short}</span></a>`;
  }).join('')}</div>`;
}

const DRAWS = {agreed:'agreement', repetition:'repetition', stalemate:'stalemate', insufficient:'insufficient material', '50move':'50-move rule', timevsinsufficient:'timeout vs insufficient material'};
function resultFor(me, op){
  if (me.result === 'win') return {kind:'win', short:'Won', text:`You won by ${op.result === 'checkmated' ? 'checkmate' : op.result === 'timeout' ? 'time' : op.result === 'resigned' ? 'resignation' : op.result}`};
  if (DRAWS[me.result]) return {kind:'draw', short:'Draw', text:`Draw by ${DRAWS[me.result]}`};
  return {kind:'loss', short:'Lost', text:`You lost by ${me.result === 'checkmated' ? 'checkmate' : me.result === 'timeout' ? 'time' : me.result === 'resigned' ? 'resignation' : me.result}`};
}

async function review(){
  const g = await findGame();
  if (g.rules !== 'chess') throw new Error('Only standard chess games can be reviewed (this one is ' + g.rules + ').');
  const flipped = g.black.username.toLowerCase() === USER;
  const me = flipped ? g.black : g.white, op = flipped ? g.white : g.black;
  const res = resultFor(me, op);
  const {moves, fens, meta} = buildPositions(g.pgn);
  const opening = g.eco ? decodeURIComponent(g.eco.split('/').pop()).replace(/-/g, ' ') : '';
  document.title = `Review: ${g.white.username} vs ${g.black.username}`;

  // ---- analysis state; filled incrementally ----
  const A = new Array(fens.length).fill(null);   // engine eval per position
  const R = new Array(moves.length).fill(null);  // classification per move
  const X = new Array(moves.length).fill(null);  // explanation per move
  const D = new Array(fens.length).fill(null);   // deeper evals, only for positions around flagged moves
  const deepQ = new Set();                       // positions still waiting for the deeper pass
  const deepAsked = new Set();

  const keyFor = d => `rv:${GAME_ID}:${d}`;

  let cached = readCache(DEPTH);
  if (!EXPLICIT_DEPTH && !(cached && cached.every(Boolean))) {
    // reuse a finished deeper analysis if one exists (e.g. opened on a laptop before)
    for (const d of [20,18,16,14]) { if (d <= DEPTH) continue; const h = readCache(d); if (h && h.every(Boolean)) { DEPTH = d; cached = h; break; } }
  }
  const DEEP_ON = DEPTH < DEEP;
  const okEval = a => a && typeof a.win === 'number' && Array.isArray(a.lines);
  if (cached) cached.forEach((a, i) => { if (okEval(a)) A[i] = a; });
  if (DEEP_ON) { const dc = readCache('deep' + DEEP); if (dc) dc.forEach((a, i) => { if (okEval(a)) D[i] = a; }); }
  fens.forEach((f, i) => {
    const stm = f.split(' ')[1];

    if (t) { A[i] = A[i] || t; D[i] = D[i] || t; }
  });
  const saveCache = () => { try {
    localStorage.setItem(keyFor(DEPTH), JSON.stringify(A));
    if (DEEP_ON && D.some((d, i) => d && !meta[i].checkmate && !meta[i].draw)) localStorage.setItem(keyFor('deep' + DEEP), JSON.stringify(D));
  } catch {} };
  const EV = i => D[i] || A[i];  // best available eval of a position, for the bar and graph

  let ply = 0;

    listHtml += `<div class="mrow"><div class="num">${i/2+1}.</div>${cell(i)}${cell(i+1)}</div><div class="note" id="nt${i}" data-p="${i+1}" hidden></div>${i+1 < moves.length ? `<div class="note" id="nt${i+1}" data-p="${i+2}" hidden></div>` : ''}`;

  app.innerHTML = `

    const r = R[i], el = $('mv' + i), nt = $('nt' + i);
    if (!el) return;
    if (!r) { if (waiting.has(i)) el.title = `Double-checking at depth ${DEEP}`; return; }
    el.querySelector('.dot').outerHTML = dotHtml(r.cls);
    el.title = CLS[r.cls].label;
    if (NOTABLE.includes(r.cls) && X[i]) {
      nt.hidden = false;
      nt.style.borderLeftColor = CLS[r.cls].color;
      nt.innerHTML = `<b>${dotHtml(r.cls)}${esc(moveLabel(i))}${CLS[r.cls].sym}</b> <span style="color:${CLS[r.cls].color};font-weight:700">${CLS[r.cls].label}.</span> ${esc(X[i].note)}`;
    } else nt.hidden = true;
  }

  function renderGraph(){
    const pts = [];
    A.forEach((a, i) => { if (a) pts.push(`${(i/N*100).toFixed(2)},${(100 - EV(i).win).toFixed(2)}`); });
    let lastX = 0; for (let i = A.length - 1; i >= 0; i--) if (A[i]) { lastX = i/N*100; break; }
    const marks = R.map((r, i) => r && ['mistake','blunder','brilliant','great'].includes(r.cls)
      ? `<line x1="${((i+1)/N*100).toFixed(2)}" x2="${((i+1)/N*100).toFixed(2)}" y1="${(100 - r.Af.win - 5).toFixed(2)}" y2="${(100 - r.Af.win + 5).toFixed(2)}" stroke="${CLS[r.cls].color}" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : '').join('');
    gr.innerHTML = `${pts.length ? `<polygon points="0,100 ${pts.join(' ')} ${lastX.toFixed(2)},100" fill="#f2f2f2"/>` : ''}<line x1="0" y1="50" x2="100" y2="50" stroke="#888" stroke-width=".4"/>${marks}
      <line id="gcur" x1="${ply/N*100}" y1="0" x2="${ply/N*100}" y2="100" stroke="var(--accent)" stroke-width=".6"/>`;
  }

  // A move is classified from the base-depth evals. If that says inaccuracy/mistake/blunder, the verdict is held
  // back until both positions have been re-analyzed at DEEP, and the deeper pair decides (it may clear the move).
  function tryClassify(i){
    if (i < 0 || i >= moves.length || R[i] || !A[i] || !A[i+1]) return false;
    let B = A[i], Af = A[i+1], deep = false;
    if (DEEP_ON && BAD.includes(classifyMove(i, moves, fens, meta, B, Af).cls)) {
      if (!D[i] || !D[i+1]) {
        for (const p of [i, i+1]) if (!D[p] && !deepAsked.has(p)) { deepQ.add(p); deepAsked.add(p); }
        waiting.add(i); renderMoveCell(i);
        return false;
      }
      B = D[i]; Af = D[i+1]; deep = true;
    }
    waiting.delete(i);
    R[i] = {...classifyMove(i, moves, fens, meta, B, Af), B, Af, deep};
    try { X[i] = explainMove(i, ctx, B, Af); } catch (e) { console.error(e); X[i] = {text:'', note:''}; }
    renderMoveCell(i);
    return true;
  }

  function setStatus(){
    const base = A.filter(Boolean).length, deepDone = deepAsked.size - deepQ.size;
    $('sbar').style.width = (100 * (base + deepDone) / (A.length + deepAsked.size)) + '%';
    const flagged = waiting.size;
    $('stxt').textContent = base < A.length
      ? `Analyzing ${base}/${A.length} positions · depth ${DEPTH} · results fill in as they finish`
      : flagged ? `Double-checking ${flagged} flagged move${flagged === 1 ? '' : 's'} at depth ${DEEP}…`
      : `Analysis complete · Stockfish depth ${DEPTH}${deepAsked.size ? ` (flagged moves checked at ${DEEP})` : ''}`;
  }

  // ---- board / coach ----
  function sqXY(sq){ const f = sq.charCodeAt(0) - 97, r = +sq[1]; return flipped ? [7 - f + .5, r - 1 + .5] : [f + .5, 8 - r + .5]; }
  function arrow(uci, color){
    const [x1, y1] = sqXY(uci.slice(0,2)), [x2, y2] = sqXY(uci.slice(2,4));
    const len = Math.hypot(x2-x1, y2-y1), ux = (x2-x1)/len, uy = (y2-y1)/len, ex = x2 - ux*.3, ey = y2 - uy*.3;
    return `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width=".18" stroke-linecap="round" opacity=".85"/>
      <polygon points="${x2},${y2} ${ex - uy*.25},${ey + ux*.25} ${ex + uy*.25},${ey - ux*.25}" fill="${color}" opacity=".85"/>`;
  }
  // scroll only the move list (never the page) so stepping through moves doesn't make the page jump
  function revealInList(el){
    if (!el) return;
    const nt = $('nt' + (+el.dataset.p - 1));
    const t = el.offsetTop, b = (nt && !nt.hidden ? nt.offsetTop + nt.offsetHeight : t + el.offsetHeight);
    if (t < mvBox.scrollTop + 4) mvBox.scrollTop = Math.max(0, t - 8);
    else if (b > mvBox.scrollTop + mvBox.clientHeight - 4) mvBox.scrollTop = b - mvBox.clientHeight + 8;
  }

  function go(p, scroll = true, anchor = null){
    // iOS Safari has no scroll anchoring: if the tap came from below the coach panel, keep that spot still on screen
    const anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
    ply = Math.max(0, Math.min(moves.length, p));
    const c = new Chess(fens[ply]), board = c.board();
    const last = ply > 0 ? moves[ply-1] : null, r = ply > 0 ? R[ply-1] : null;
    const hlColor = r ? CLS[r.cls].color : 'var(--c-pending)';
    let h = '';
    for (let dr = 0; dr < 8; dr++) for (let dc = 0; dc < 8; dc++) {
      const row = flipped ? 7 - dr : dr, col = flipped ? 7 - dc : dc;
      const sq = 'abcdefgh'[col] + (8 - row), cell = board[row][col];
      const light = (row + col) % 2 === 0;
      let inner = '';
      if (last && (sq === last.from || sq === last.to)) inner += `<div class="hl" style="background:${hlColor}"></div>`;
      if (cell) inner += `<piece class="${PIECE[cell.type]} ${cell.color === 'w' ? 'white' : 'black'}"></piece>`;
      if (r && sq === last.to) inner += dotHtml(r.cls, 'badge');
      if (dr === 7) inner += `<span class="coord f" style="color:${light ? 'var(--dark)' : 'var(--light)'}">${'abcdefgh'[col]}</span>`;
      if (dc === 0) inner += `<span class="coord r" style="color:${light ? 'var(--dark)' : 'var(--light)'}">${8 - row}</span>`;
      h += `<div class="sq ${light ? 'l' : 'd'}">${inner}</div>`;
    }
    let arrows = '';
    if (r && !r.isBest && r.bestUci && !['brilliant','great','best','forced','book'].includes(r.cls)) arrows += arrow(r.bestUci, '#16a34a');
    h += `<svg class="arrows" viewBox="0 0 8 8">${arrows}</svg>`;
    $('board').innerHTML = h;

    const ev = r ? r.Af : EV(ply);
    $('evalbar').querySelector('.w').style.height = (ev ? ev.win : 50) + '%';
    // the label sits inside the bar, at the end of the side that's ahead, sized so it always fits the bar's width
    const et = $('evtxt'); et.textContent = ev ? ev.text : '…';
    const whiteAhead = !ev || ev.win >= 50, atBottom = whiteAhead !== flipped;
    et.style.top = atBottom ? 'auto' : '3px'; et.style.bottom = atBottom ? '3px' : 'auto';
    et.style.color = whiteAhead ? '#333' : '#ddd';
    et.style.fontSize = '10px';
    for (let fs = 10; fs > 7 && et.scrollWidth > et.clientWidth; fs -= .5) et.style.fontSize = fs + 'px';

    const coach = $('coach');
    if (!last) coach.innerHTML = `<div class="icon" style="background:var(--muted)">${svgIcon('start')}</div><div><b>Start of the game</b><div class="sub expl">${SMALL ? 'Tap ▶ / ◀ or swipe the board to step through.' : 'Use ▶ / ◀ or the arrow keys to step through.'} Tap any move, the graph, or a key moment to jump. Notable moves are explained right in the move list.</div></div>`;
    else if (!r) coach.innerHTML = `<div class="icon" style="background:var(--c-pending)">${svgIcon('pending')}</div><div><b>${esc(moveLabel(ply-1))}</b><div class="sub expl">${waiting.has(ply-1)
      ? `The quick pass flagged this move, so Stockfish is double-checking it at depth ${DEEP} before giving a verdict. This fills in after the rest of the game is analyzed.`
      : `Stockfish is still looking at this position. The explanation appears here as soon as it's done.`}</div></div>`;
    else {
      const who = last.color === 'w' ? g.white.username : g.black.username;
      const msg = `<b>${esc(last.san)} is ${r.cls === 'best' && !r.isBest ? 'as good as the best move' : CLS[r.cls].say}</b>`;
      let detail = `${esc(who)} · engine eval ${r.B.text} → ${r.Af.text}${r.deep ? ` (checked at depth ${DEEP})` : ''}`;
      const bl = r.B.lines[0];
      if (!r.isBest && r.best && bl && !['brilliant','forced','book'].includes(r.cls)) detail += ` · engine line: ${esc(pvSan(fens[ply-1], bl.pv, 6))}`;
      coach.innerHTML = `${dotHtml(r.cls, 'icon')}<div>${msg}<div class="expl">${esc(X[ply-1]?.text || '')}</div><div class="sub">${detail}</div></div>`;
    }
    mvBox.querySelectorAll('.cur').forEach(el => el.classList.remove('cur'));
    const curEl = $('mv' + (ply - 1));
    if (curEl) { curEl.classList.add('cur'); $('nt' + (ply - 1))?.classList.add('cur'); if (scroll) revealInList(curEl); }
    const gc = $('gcur'); if (gc) { gc.setAttribute('x1', ply/N*100); gc.setAttribute('x2', ply/N*100); }
    if (anchor) { const d = anchor.getBoundingClientRect().top - anchorTop; if (Math.abs(d) > 1) window.scrollBy(0, d); }
  }

  // ---- events ----
  const jump = e => { const t = e.target.closest('[data-p]'); if (t) go(+t.dataset.p, true, e.currentTarget); };
  mvBox.addEventListener('click', jump);
  $('keys').addEventListener('click', jump);
  gr.addEventListener('click', e => { const b = gr.getBoundingClientRect(); go(Math.round((e.clientX - b.left) / b.width * N)); });
  document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => go({first:0, prev:ply-1, next:ply+1, last:moves.length}[b.dataset.n])));
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('select,input')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(ply-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(ply+1); }
  });
  let tx = null, ty = 0;
  const bd = $('board');
  bd.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  bd.addEventListener('touchend', e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) go(ply + (dx < 0 ? 1 : -1));
  }, {passive:true});
  $('depth').addEventListener('change', e => { qs.set('depth', e.target.value); location.search = qs.toString(); });
  window.addEventListener('pagehide', saveCache);

  // ---- first paint: board and move list right away, plus anything already cached ----
  for (let i = 0; i < moves.length; i++) tryClassify(i);
  renderSummary(); renderGraph(); setStatus(); go(0);
  if (A.every(Boolean) && !deepQ.size) return;

  // ---- incremental engine pass; the position on screen jumps the queue ----
  let eng;
  try { eng = new Engine(); await eng.init(); }
  catch (e) { $('stxt').textContent = `Couldn't start Stockfish: ${e.message}. Reload to try again.`; eng?.w.terminate(); return; }
  let sinceSave = 0;
  const toEval = (raw, stm) => {
    if (!raw.length) return {win:50, text:'?', lines:[]};
    const lines = raw.map(l => ({uci:l.pv[0], pv:l.pv.slice(0, PV_LEN), ...toWhite(l, stm)}));
    return {win:lines[0].win, text:lines[0].text, lines};
  };
  for (;;) {
    // base pass first (the position on screen jumps the queue); the deeper checks only run once it's done,
    // so they never hold up the board, the move list or verdicts already shown
    let i = A[ply] == null ? ply : (ply > 0 && A[ply-1] == null) ? ply - 1 : A.indexOf(null), deep = false;
    if (i < 0) {
      if (!deepQ.size) break;
      deep = true;
      i = deepQ.has(ply - 1) ? ply - 1 : deepQ.has(ply) ? ply : [...deepQ].sort((a, b) => a - b)[0];
    }
    const stm = fens[i].split(' ')[1];
    const raw = await eng.analyse(fens[i], deep ? DEEP : DEPTH);
    if (deep) { D[i] = toEval(raw, stm); deepQ.delete(i); }
    else if (A[i]) continue;
    else A[i] = toEval(raw, stm);
    const changed = tryClassify(i - 1) | tryClassify(i);
    setStatus(); renderGraph();
    if (changed) renderSummary();
    if (i === ply || i === ply - 1) go(ply, false);
    if (++sinceSave >= 5) { saveCache(); sinceSave = 0; }
  }
  eng.w.terminate();
  saveCache(); renderSummary(); setStatus(); go(ply, false);
}

(async () => {
  try {
    if (!USER) {
      app.innerHTML = `<h1>Game Review</h1><div class="card"><form><label>chess.com username <input name="user" required autocapitalize="none" autocorrect="off"></label> <button class="btn" style="flex:none;font-size:16px;margin-top:8px">Show games</button></form></div>`;
    } else if (!GAME_ID) await gameList();
    else await review();
  } catch (e) {
    app.innerHTML = `<div class="card"><b>Couldn't load the review.</b><div class="sub">${esc(e.message)}</div></div>`;
    console.error(e);
  }
})();
</script>
</body>
